services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://mock:4001/v1}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    volumes:
      - aegis-data:/data
    depends_on:
      - mock

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      AEGIS_URL: http://gateway:8080
      AEGIS_ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (32+ random characters)}
      # Plain HTTP on localhost; set to true (the default) behind HTTPS.
      COOKIE_SECURE: "false"
    depends_on:
      - gateway

  # Offline fake LLM for demos. Point UPSTREAM_BASE_URL at a real provider to bypass it.
  mock:
    build: .
    command: ["node", "dist/mock/upstream.js"]
    environment:
      MOCK_PORT: "4001"

volumes:
  aegis-data:
